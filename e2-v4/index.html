<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El tocadiscos del mundo</title>
  <meta name="description" content="Cuatro discos de género: los álbumes más vendidos de rock, pop, hip hop y electrónica en seis países, década a década, de 1970 a 2020. Entrega 2 de IIC2026 (Grupo 31).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23000000'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23e53935' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/estilo.css?v=2026-11-24d">
</head>
<body class="sin-disco">
  <header>
    <h1>El tocadiscos del mundo</h1>
    <div id="discos" role="group" aria-label="Disco"></div>
    <div class="controles">
      <span id="estado-audio" aria-live="polite"></span>
      <span id="lector" hidden>Sensor de color conectado</span>
      <button id="tocadiscos" class="enlace" type="button" hidden>Conectar tocadiscos</button>
      <button id="pausa" type="button" aria-pressed="false">Pausa</button>
    </div>
  </header>

  <main>
    <section class="album" aria-label="Álbum que suena" aria-live="polite">
      <div id="carrusel" class="carrusel" aria-hidden="true"></div>
      <div class="leyenda">
        <div class="titulo" id="album-titulo"></div>
        <div class="artista" id="album-artista"></div>
        <div class="nota" id="album-nota"></div>
        <div class="cancion" id="album-cancion"><span class="rotulo">Está sonando:</span> <span id="album-cancion-nombre"></span></div>
      </div>
    </section>

    <aside class="panel">
      <div class="cuota-marco" id="cuota-marco" aria-live="polite">
        <div class="cuota-cifra" id="cuota-cifra"></div>
        <p id="cuota-texto"></p>
      </div>
      <div class="top-marco">
        <h2 id="top-titulo">Top 5 álbumes más vendidos</h2>
        <ol id="top"></ol>
        <p id="top-vacio" hidden></p>
      </div>
    </aside>
  </main>

  <nav class="dial-marco" aria-label="Dial de países">
    <span class="dial-nombre">País</span>
    <div id="dial" class="dial"><i id="aguja" class="aguja"></i></div>
  </nav>

  <nav class="dial-marco" aria-label="Dial de décadas" title="← → década · ↑ ↓ país · 1–4 disco · 0 sin disco · Espacio pausa">
    <span class="dial-nombre">Década</span>
    <div id="dial-decada" class="dial"><i id="aguja-decada" class="aguja"></i></div>
  </nav>

  <script src="../datos/e2/decadas.js?v=2026-11-22c"></script>
  <script src="js/discos.js?v=2026-11-22a"></script>
  <script src="js/datos.js?v=2026-11-22d"></script>
  <script src="js/reproductor.js?v=2026-11-22a"></script>
  <script src="js/aplausos.js?v=2026-11-18a"></script>
  <script src="js/ovacion.js?v=2026-11-22a"></script>
  <script src="js/estatica.js?v=2026-11-18a"></script>
  <script src="js/tocadiscos.js?v=2026-11-22e"></script>
  <script src="js/main.js?v=2026-11-24a"></script>
</body>
</html>
